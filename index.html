<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press me</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #fff;
      font-family: system-ui, sans-serif;
    }
    button {
      background: #e11d1d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 1rem 2.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #c01010; }
    button:active { transform: scale(0.97); }
    #countdown { font-size: 2rem; font-variant-numeric: tabular-nums; min-height: 2.5rem; }
    #message {
      font-size: 2.5rem;
      font-weight: 700;
      min-height: 3rem;
      text-align: center;
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <button id="btn">Press me</button>
  <div id="message" aria-live="polite"></div>
  <div id="countdown"></div>
  <iframe id="player" title="Video" src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&enablejsapi=1"
    allow="autoplay; encrypted-media; fullscreen" allowfullscreen
    style="position:fixed;left:-9999px;top:0;width:640px;height:360px;border:0"></iframe>

  <script>
    const words = "Fucc you, Nick".split(" ");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("message");
    const countdown = document.getElementById("countdown");
    const EMBED_URL = "https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&enablejsapi=1";
    let player = null;

    // Preload the player hidden; it stays paused until "I am ready!" is pressed.
    const ytTag = document.createElement("script");
    ytTag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytTag);
    window.onYouTubeIframeAPIReady = () => { player = new YT.Player("player"); };
    let timer = null;

    function showReady() {
      btn.remove();
      msg.textContent = "Are you ready?";
      countdown.textContent = "";
      const ready = document.createElement("button");
      ready.textContent = "I am ready!";
      ready.addEventListener("click", playVideo);
      document.body.appendChild(ready);
    }

    function playVideo() {
      document.body.style.background = "#000";
      Array.from(document.body.children).forEach(el => {
        if (el.id !== "player") el.remove();
      });
      const frame = document.getElementById("player");
      frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
      if (player && player.playVideo) player.playVideo();
      else frame.src = EMBED_URL + "&autoplay=1";
    }

    function startCountdown() {
      let n = 60;
      countdown.textContent = n;
      timer = setInterval(() => {
        countdown.textContent = --n;
        if (n <= 0) { clearInterval(timer); showReady(); }
      }, 1000);
    }

    btn.addEventListener("click", () => {
      clearInterval(timer);
      msg.textContent = "";
      countdown.textContent = "";
      let i = 0;
      timer = setInterval(() => {
        msg.textContent += (i ? " " : "") + words[i++];
        if (i >= words.length) { clearInterval(timer); startCountdown(); }
      }, 600);
    });
  </script>
</body>
</html>
